<div class="limiter">
    <div class="login-container">
        <div class="wrap-login">
            <div class="login-pic js-tilt" data-tilt style="will-change: transform; transform: perspective(300px) rotateX(0deg) rotateY(0deg);">
                <img src="../../assets/images/login.png" alt="IMG">
            </div>
            <div class="login-form validate-form">
                <span class="login-form-title">Login</span>
                <div class="wrap-input validate-input">
                    <span class="symbol-input">
                        <i class="fa fa-envelope" aria-hidden="true">
                        </i>
                    </span>
                    <input type="text" class="input" name="email" placeholder="Email">
                </div>
                <div class="wrap-input validate-input">
                    <span class="symbol-input">
                        <i class="fa fa-lock" aria-hidden="true">
                        </i>
                    </span>
                    <input type="password" class="input" name="password" placeholder="Password">
                </div>
                <div class="container-login-btn">
                    <button class="login-btn">Login</button>
                </div>

                <div class="text-center forgot-btn">
                    <a href="#">Forgot Username/Password?</a>    
                </div>
            </div>
        </div>
    </div>
</div>
